  nb.forEach(function(e){var d=dist[u]+e[1];if(dist[e[0]]==null||d<dist[e[0]]){dist[e[0]]=d;prev[e[0]]=u;Q.push(e[0])}})}
 return null}
// simulated trains
var SPD={metro:11,tram:5.5,cable:5},HW={metro:240,tram:420,cable:30};var ICON={metro:'🚇',tram:'🚋',cable:'🚡'};var TR=[];
ORDER.forEach(function(k){var l=N[k];var v=SPD[l.kind],cyc=2*l.len/v,n=Math.max(1,Math.min(l.kind==='cable'?12:14,Math.round(cyc/HW[l.kind])));
 for(var j=0;j<n;j++){var m=L.marker(l.path[0],{icon:L.divIcon({className:'',html:'<div class="tr">'+ICON[l.kind]+'</div>',iconSize:[22,22],iconAnchor:[11,11]}),interactive:false,zIndexOffset:500}).addTo(map);TR.push({l:l,v:v,off:j*cyc/n,cyc:cyc,m:m})}});
function ptAt(l,d){var c=l.cum,i=1;while(i<c.length-1&&c[i]<d)i++;var a=l.path[i-1],b=l.path[i],s=c[i]-c[i-1]||1,t=(d-c[i-1])/s;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function moveTrains(){var t=Date.now()/1000;TR.forEach(function(r){var x=(t+r.off)%r.cyc*r.v,d=x<=r.l.len?x:2*r.l.len-x;r.m.setLatLng(ptAt(r.l,Math.max(0,Math.min(r.l.len,d))))})}
setInterval(moveTrains,1000);moveTrains();
// state
var dest=JSON.parse(localStorage.getItem('mdeDest2')||'null'),me=null,meMk=null,said={},path=null,demo=null;
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='es-CO';speechSynthesis.speak(u)}catch(e){}if(navigator.vibrate)navigator.vibrate([400,150,400,150,400])}
function nearestNode(la,lo,cand){var b=null,bd=1e12;(cand||NODES).forEach(function(n){var d=hav(la,lo,n.lat,n.lon);if(d<bd){bd=d;b=n}});return[b,bd]}
var routeLine=null;
function drawPath(){if(routeLine){map.removeLayer(routeLine);routeLine=null}if(!path)return;routeLine=L.polyline(path.map(function(id){return[NODES[id].lat,NODES[id].lon]}),{color:'#111',weight:3,opacity:.5,dashArray:'6 6'}).addTo(map)}
function onPos(la,lo){me=[la,lo];
 if(!meMk){meMk=L.circleMarker(me,{radius:9,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);map.setView(me,15)}else meMk.setLatLng(me);
 if(demo)map.panTo(me,{animate:true});
 var cand=path?path.map(function(id){return NODES[id]}):null;var r=nearestNode(la,lo,cand),best=r[0],bd=r[1];
 if(!path&&bd>50000){$('near').textContent='Lejos de Medellín';$('next').textContent='Use Modo prueba';$('dist').textContent=fd(bd);return}
 $('near').textContent=best.n+' · '+N[best.line].name;
 if(dest&&!path){path=plan(best.id,dest.n);said={};drawPath()}
 var al=$('alert');al.style.display='none';
 if(!path){var a=N[best.line].st;$('next').textContent='—';$('dist').textContent=fd(bd);$('route').textContent='';return}
 var k=path.indexOf(best.id);if(k<0)k=0;
 // advance if past station toward next
 var nxId=path[k+1];if(nxId!=null){var nx=NODES[nxId];var dn=hav(la,lo,nx.lat,nx.lon);
  $('next').textContent=nx.n;$('dist').textContent=fd(dn);
  // transfer or end ahead?
  var last=NODES[path[path.length-1]];var isTr=path[k+2]!=null&&NODES[path[k+2]].n===nx.n;
  if(nx.n===last.n&&k+1===path.length-1||isTr){var msg=isTr?'¡Bájese en la próxima! '+nx.n+': cambie a '+N[NODES[path[k+2]].line].name:'¡Bájese en la próxima! '+nx.n;al.textContent=msg;al.style.display='block';var key='n'+nx.n;if(!said[key]){said[key]=1;say('Atención. Bájese en la próxima estación: '+nx.n+(isTr?'. Haga trasbordo a la '+N[NODES[path[k+2]].line].name:''))}}
 }else{$('next').textContent='Llegó';$('dist').textContent=fd(bd);al.textContent='Llegó a '+best.n;al.style.display='block';if(!said.fin){said.fin=1;say('Llegó a '+best.n+'. Bájese aquí.')}}
 var segs=[],cur=null;path.forEach(function(id){var l=NODES[id].line;if(l!==cur){segs.push(N[l].name);cur=l}});
 var nst=0;for(var i=1;i<path.length;i++)if(NODES[path[i]].n!==NODES[path[i-1]].n)nst++;
 $('route').textContent='→ '+dest.n+' · '+nst+' estaciones · '+segs.join(' › ');
}
if(navigator.geolocation)navigator.geolocation.watchPosition(function(p){if(!demo)onPos(p.coords.latitude,p.coords.longitude)},function(){if(!demo)$('near').textContent='Active el GPS'},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
var pick='dest';
function build(){var h='';ORDER.forEach(function(k){var l=N[k];h+='<div class="ln"><span class="dot" style="background:'+l.color+'">'+(k==='T'?'T':k)+'</span>'+l.name+'</div>';l.st.forEach(function(s){h+='<div class="st" data-n="'+s[0]+'">'+s[0]+'</div>'})});$('list').innerHTML=h}
build();
function openSheet(m){pick=m;$('shT').textContent=m==='demo'?'Modo prueba: ¿desde dónde sale?':'Elija su destino';$('sheet').style.display='block';try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}}
$('bDest').onclick=function(){openSheet('dest')};
$('sheet').onclick=function(e){var t=e.target;if(t.classList.contains('st')){var n=t.dataset.n;$('sheet').style.display='none';
  if(pick==='dest'){dest={n:n};localStorage.setItem('mdeDest2',JSON.stringify(dest));path=null;said={};$('bDest').textContent='→ '+n;if(me)onPos(me[0],me[1])}
  else startDemo(n)}else if(t.id==='sheet')$('sheet').style.display='none'};
$('bStop').onclick=function(){dest=null;path=null;drawPath();localStorage.removeItem('mdeDest2');$('bDest').textContent='¿A dónde va?';$('route').textContent='';$('alert').style.display='none';stopDemo()};
if(dest)$('bDest').textContent='→ '+dest.n;
// demo: rides along the planned path at 4x speed
function stopDemo(){if(demo){clearInterval(demo.t);demo=null}$('demo').classList.remove('on');$('demo').textContent='▶ Modo prueba'}
$('demo').onclick=function(){if(demo){stopDemo();return}if(!dest){openSheet('dest');setTimeout(function(){},0);return}openSheet('demo')};
function startDemo(fromName){var o=BYNAME[fromName][0];path=plan(o.id,dest.n);said={};drawPath();if(!path||path.length<2){alert('Elija un origen distinto al destino');return}
 var pts=path.map(function(id){return[NODES[id].lat,NODES[id].lon]});var seg=0,t=0;$('demo').classList.add('on');$('demo').textContent='■ Parar prueba';
 demo={t:setInterval(function(){var a=pts[seg],b=pts[seg+1];if(!b){onPos(a[0],a[1]);clearInterval(demo.t);return}var d=hav(a[0],a[1],b[0],b[1]);var dur=Math.max(2,d/40);t+=1/dur;if(t>=1){t=0;seg++;onPos(b[0],b[1]);return}onPos(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t)},500)};
 map.setView(pts[0],15)}
</script></body></html>
